# Infrastructure as code: Bicep what-if on pull requests, deployment on main (with approval).
# Authenticates to Azure with OpenID Connect - no secrets are stored in GitHub.
name: Infrastructure (Bicep)

on:
  pull_request:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: infra
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-contoso-health-aks' }}
  AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}
  ADMIN_PRINCIPAL_ID: ${{ vars.ADMIN_PRINCIPAL_ID }}
  ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
  AKS_NODE_VM_SIZE: ${{ vars.AKS_NODE_VM_SIZE || 'Standard_D4ds_v5' }}

jobs:
  not-connected:
    name: Azure not connected yet
    if: vars.AZURE_CLIENT_ID == ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Azure is not connected. Add the AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and AZURE_PRINCIPAL_ID repository variables (guide step 3)."

  what-if:
    name: What-if (preview changes)
    if: github.event_name == 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Preview changes (what-if)
        run: |
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters infra/main.bicepparam \
            --no-pretty-print > whatif.json
          {
            echo "### Bicep what-if for \`$AZURE_RESOURCE_GROUP\`"
            echo ""
            echo "| Change | Resource type | Name |"
            echo "|---|---|---|"
            jq -r '.changes[] | "| \(.changeType) | \(.resourceId | split("/providers/")[-1] | split("/") | .[0:-1] | join("/")) | \(.resourceId | split("/")[-1]) |"' whatif.json
          } > whatif.md
          cat whatif.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file whatif.md

  deploy:
    name: Deploy to Azure
    if: github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep (incremental)
        run: |
          az deployment group create \
            --name "infra-${GITHUB_RUN_NUMBER}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters infra/main.bicepparam \
            --query properties.outputs -o json | tee outputs.json
          {
            echo "### Deployed \`infra-${GITHUB_RUN_NUMBER}\` to \`$AZURE_RESOURCE_GROUP\`"
            echo ""
            echo "| Output | Value |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.value) |"' outputs.json
          } >> "$GITHUB_STEP_SUMMARY"

# Application delivery: build the three images, push them to ACR and roll them out to AKS.
# Runs after every merge to main that touches the app or the manifests.
name: App (build & deploy to AKS)

on:
  push:
    branches: [main]
    paths: ['src/**', 'k8s/base/**', 'k8s/platform/**', '.github/workflows/deploy-app.yml']
  # Also roll out right after a successful infrastructure deployment (first-time setup).
  workflow_run:
    workflows: ['Infrastructure (Bicep)']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-app
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-contoso-health-aks' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'indonesiacentral' }}
  DNS_LABEL: ${{ vars.DNS_LABEL || format('contoso-health-{0}', github.repository_owner) }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  not-connected:
    name: Azure not connected yet
    if: vars.AZURE_CLIENT_ID == ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Azure is not connected. Complete guide steps 3 and 4, then re-run this workflow."

  build:
    name: Build & push images
    if: vars.AZURE_CLIENT_ID != '' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # No environment here: building images needs no approval. OIDC subject = ref:refs/heads/main.
    outputs:
      registry: ${{ steps.acr.outputs.loginServer }}
      ready: ${{ steps.acr.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Find the registry created by the IaC workflow
        id: acr
        run: |
          name=$(az acr list -g "$AZURE_RESOURCE_GROUP" --query "[0].name" -o tsv 2>/dev/null || true)
          aks=$(az aks list -g "$AZURE_RESOURCE_GROUP" --query "[?provisioningState=='Succeeded'] | [0].name" -o tsv 2>/dev/null || true)
          if [ -z "$name" ] || [ -z "$aks" ]; then
            echo "::notice::Registry or cluster not ready in $AZURE_RESOURCE_GROUP yet. The app is deployed automatically when the Infrastructure workflow succeeds."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "loginServer=$(az acr show -n "$name" --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"
      - name: Log in to ACR (token from the OIDC session)
        if: steps.acr.outputs.ready == 'true'
        run: az acr login --name "${{ steps.acr.outputs.name }}"
      - uses: docker/setup-buildx-action@v4
        if: steps.acr.outputs.ready == 'true'
      - name: Build and push
        if: steps.acr.outputs.ready == 'true'
        run: |
          for svc in membership-api bed-api portal; do
            docker buildx build --push \
              --tag "${{ steps.acr.outputs.loginServer }}/contoso-health/$svc:$IMAGE_TAG" \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              "src/$svc"
          done
          echo "Pushed contoso-health/{membership-api,bed-api,portal}:$IMAGE_TAG to ${{ steps.acr.outputs.loginServer }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to AKS
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.smoke.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Connect to the cluster with Microsoft Entra ID
        run: |
          AKS_NAME=$(az aks list -g "$AZURE_RESOURCE_GROUP" --query "[0].name" -o tsv)
          echo "AKS_NAME=$AKS_NAME" >> "$GITHUB_ENV"
          az aks get-credentials -g "$AZURE_RESOURCE_GROUP" -n "$AKS_NAME" --overwrite-existing
          # Local accounts are disabled: use an Entra ID token for the AKS server application
          # (the same token kubelogin's azurecli mode would fetch).
          TOKEN=$(az account get-access-token --resource 6dae42f8-4368-4678-94ff-3960e28e3630 --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          kubectl config set-credentials github-actions --token="$TOKEN"
          kubectl config set-context --current --user=github-actions
          kubectl version
      - name: Render this release with kustomize
        env:
          REGISTRY: ${{ needs.build.outputs.registry }}
        run: |
          mkdir -p k8s/release
          cat > k8s/release/kustomization.yaml <<YAML
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../base
          images:
            - name: contoso-health/membership-api
              newName: ${REGISTRY}/contoso-health/membership-api
              newTag: "${IMAGE_TAG}"
            - name: contoso-health/bed-api
              newName: ${REGISTRY}/contoso-health/bed-api
              newTag: "${IMAGE_TAG}"
            - name: contoso-health/portal
              newName: ${REGISTRY}/contoso-health/portal
              newTag: "${IMAGE_TAG}"
          configMapGenerator:
            - name: app-config
              behavior: replace
              literals:
                - APP_VERSION=${IMAGE_TAG}
                - AZURE_REGION=${AZURE_LOCATION}
                - CLUSTER_NAME=${AKS_NAME}
          patches:
            - target:
                kind: Service
                name: portal
              patch: |-
                - op: replace
                  path: /metadata/annotations/service.beta.kubernetes.io~1azure-dns-label-name
                  value: ${DNS_LABEL}
          YAML
          kubectl kustomize k8s/release > release.yaml
          grep -E "image:|APP_VERSION|dns-label" release.yaml
      - name: Apply platform config and workloads
        run: |
          kubectl apply -k k8s/platform
          kubectl apply -f release.yaml
          for d in membership-api bed-api portal; do
            kubectl -n contoso-health rollout status "deploy/$d" --timeout=300s
          done
          kubectl -n contoso-health get deploy,pods,svc -o wide
      - name: Smoke test through the public endpoint
        id: smoke
        run: |
          for i in $(seq 1 30); do
            IP=$(kubectl -n contoso-health get svc portal -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            [ -n "$IP" ] && break; sleep 10
          done
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "http://$IP/api/info" | tee info.json
          curl -fsS "http://$IP/api/membership/payments/summary" > /dev/null
          curl -fsS "http://$IP/api/capacity/beds/summary" > /dev/null
          URL="http://${DNS_LABEL}.${AZURE_LOCATION}.cloudapp.azure.com"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Contoso Health is live"
            echo ""
            echo "- Portal: $URL (public IP $IP)"
            echo "- Version: \`$IMAGE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

# Zero-trust inside the namespace: deny all ingress, then open only what each tier needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The portal is the only public entry point (Azure Load Balancer -> port 8080).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-portal-ingress
spec:
  podSelector:
    matchLabels: { app: portal }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 8080, protocol: TCP }
---
# Back-end APIs accept traffic only from the portal and from the metrics agent in kube-system.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-from-portal-and-monitoring
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [membership-api, bed-api] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: portal }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 8080, protocol: TCP }

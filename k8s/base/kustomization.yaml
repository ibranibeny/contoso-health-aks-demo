apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: contoso-health
labels:
  - pairs:
      app.kubernetes.io/part-of: contoso-health
resources:
  - namespace.yaml
  - membership-api.yaml
  - bed-api.yaml
  - portal.yaml
  - network-policies.yaml
configMapGenerator:
  - name: app-config
    literals:
      - APP_VERSION=dev
      - AZURE_REGION=local
      - CLUSTER_NAME=local

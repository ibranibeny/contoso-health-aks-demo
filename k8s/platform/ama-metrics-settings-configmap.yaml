# Azure Monitor managed Prometheus: scrape pods annotated with prometheus.io/scrape=true
# in the contoso-health namespace (app metrics such as contoso_http_requests_total).
kind: ConfigMap
apiVersion: v1
metadata:
  name: ama-metrics-settings-configmap
  namespace: kube-system
data:
  schema-version: v1
  config-version: ver1
  pod-annotation-based-scraping: |-
    podannotationnamespaceregex = "contoso-health"
